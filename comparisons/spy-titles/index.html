<!doctype html><meta charset="utf-8"><title>The Velvet Cipher / Key Exchange</title><style>html,body{margin:0;overflow:hidden;background:#090c10}canvas{width:100vw;height:100vh;display:block}@font-face{font-family:"League Gothic";src:url("fonts/LeagueGothic.ttf");font-weight:100 900;}</style><canvas></canvas><script type="module">
const C=document.querySelector('canvas'),g=C.getContext('2d');C.width=1280;C.height=720;
const TAU=Math.PI*2,cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),mix=(a,b,p)=>a+(b-a)*p,E=x=>{x=cl(x);return x*x*(3-2*x)},Q=x=>1-Math.pow(1-cl(x),4),hash=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)},S=(a,b,t)=>E((t-a)/(b-a));
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function line(pts,c='#fff',w=2,dash=[]){g.strokeStyle=c;g.lineWidth=w;g.lineJoin='round';g.lineCap='round';g.setLineDash(dash);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();g.setLineDash([])}
function poly(pts,c,stroke=null,w=2){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function circ(x,y,r,c,stroke=null,w=2){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function text(s,x,y,size=30,c='#fff',font='Inter',weight=500,align='left'){g.fillStyle=c;g.font=`${weight} ${size}px "${font}"`;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y)}
function round(x,y,w,h,r,c,stroke=null,lw=1){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function ellipse(x,y,rx,ry,c,stroke=null,w=2){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function camera(x,y,z,roll=0){g.translate(640,360);g.scale(z,z);g.rotate(roll);g.translate(-x,-y)}
function clear(c){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.shadowBlur=0;rect(0,0,1280,720,c)}


const ink='#1b1714',cream='#efe4c9',red='#d23a22',gold='#e2a52a';
function cut(pts,c){let pp=[];pts.forEach((p,i)=>{let q=pts[(i+1)%pts.length],d=Math.hypot(q[0]-p[0],q[1]-p[1]),n=Math.ceil(d/10);for(let j=0;j<n;j++){let u=j/n,b=(hash(i*31+j)-.5)*2;pp.push([mix(p[0],q[0],u)+(q[1]-p[1])/d*b,mix(p[1],q[1],u)-(q[0]-p[0])/d*b])}});poly(pp,c,cream,2)}
function agent(x,y,s,t,flip=1){g.save();g.translate(x,y);g.scale(s*flip,s);let a=Math.sin(Math.floor(t*12)/12*12)*26;g.strokeStyle=cream;g.lineWidth=4;cut([[-20,-100],[15,-100],[32,-25],[-37,-25]],ink);circ(0,-125,17,ink);cut([[-24,-143],[20,-143],[26,-135],[-28,-135]],ink);cut([[-12,-30],[-20+a,26],[-4+a,29],[7,-28]],ink);cut([[3,-30],[34-a,28],[48-a,26],[17,-30]],ink);line([[-15,-85],[-50-a,-45],[-70,-55]],ink,12);line([[12,-84],[43+a,-65],[70,-85]],ink,12);poly([[12,-100],[73,-110+Math.sin(t*7)*8],[25,-90]],red);g.restore()}
function key(x,y,s,r=0){g.save();g.translate(x,y);g.rotate(r);g.scale(s,s);circ(0,0,25,ink);circ(0,0,17,gold);circ(0,0,8,ink);rect(18,-7,65,14,ink);rect(22,-4,58,8,gold);rect(59,0,9,22,ink);rect(63,2,4,15,gold);g.restore()}
window.render=t=>{let sc=t<6?0:t<12?1:t<16?2:3;clear([cream,red,ink,cream][sc]);if(sc==0){for(let i=0;i<10;i++)rect(i*160-(t*35)%160,120,110,330,'#d9cdb1');text('A NIGHT TRAIN',55,230,132,ink,'League Gothic');rect(0,480,1280,18,ink);for(let i=0;i<18;i++)rect(i*95-(t*100)%95,506,60,8,ink);agent(350+t*60,463,1.8,t);key(650+t*45,335,.9,t*.15);text('AN IMAGINARY 1964 THRILLER',55,650,24,ink,'League Gothic')}if(sc==1){for(let i=0;i<7;i++){let x=150+i*140,y=590-i*52;cut([[x,y],[x+150,y],[x+150,y+29],[x,y+29]],cream)}text('THE TRANSFER',690,210,115,cream,'League Gothic');agent(470+(t-6)*42,355-(t-6)*10,1.6,t);agent(880-(t-6)*15,295,.9,t,-1);key(630+(t-6)*25,290+(t-6)*20,.9,t)}if(sc==2){circ(640,270,200,gold);rect(560,270,160,330,gold);agent(610,450,2,t<13.5?t:13.5);key(730,300,1.4,-.5);text('HOLD YOUR BREATH',75,650,53,cream,'League Gothic')}if(sc==3){for(let i=0;i<9;i++){g.save();g.translate((1-Q((t-16)/.7))*(i%2?1500:-1500),0);cut([[i*155-100,0],[i*155+100,0],[i*155-200,720],[i*155-400,720]],i%2?gold:'#dfd3b7');g.restore()}text('THE VELVET',640,300,145,ink,'League Gothic',500,'center');text('CIPHER',640,500,220,ink,'League Gothic',500,'center');key(1040,600,.8,Math.PI);text('ONE KEY. EVERY DOOR.',640,650,29,ink,'League Gothic',500,'center')}for(let i=0;i<190;i++){let x=hash(i)*1280,y=hash(i+800)*720;rect(x,y,1+hash(i+55)*3,.6,'#211b1310')}};

window.DUR=20;window.READY=false;await Promise.all([document.fonts.load('40px "League Gothic"')]);window.render(0);window.READY=true;</script>
