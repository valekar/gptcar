<!doctype html><meta charset="utf-8"><title>Midnight Delivery</title><style>html,body{margin:0;overflow:hidden;background:#090c10}canvas{width:100vw;height:100vh;display:block}@font-face{font-family:"Limelight";src:url("fonts/Limelight.ttf");font-weight:100 900;}@font-face{font-family:"Cinzel";src:url("fonts/Cinzel.ttf");font-weight:100 900;}</style><canvas></canvas><script type="module">
const C=document.querySelector('canvas'),g=C.getContext('2d');C.width=1280;C.height=720;
const TAU=Math.PI*2,cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),mix=(a,b,p)=>a+(b-a)*p,E=x=>{x=cl(x);return x*x*(3-2*x)},Q=x=>1-Math.pow(1-cl(x),4),hash=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)},S=(a,b,t)=>E((t-a)/(b-a));
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function line(pts,c='#fff',w=2,dash=[]){g.strokeStyle=c;g.lineWidth=w;g.lineJoin='round';g.lineCap='round';g.setLineDash(dash);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();g.setLineDash([])}
function poly(pts,c,stroke=null,w=2){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function circ(x,y,r,c,stroke=null,w=2){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function text(s,x,y,size=30,c='#fff',font='Inter',weight=500,align='left'){g.fillStyle=c;g.font=`${weight} ${size}px "${font}"`;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y)}
function round(x,y,w,h,r,c,stroke=null,lw=1){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function ellipse(x,y,rx,ry,c,stroke=null,w=2){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function camera(x,y,z,roll=0){g.translate(640,360);g.scale(z,z);g.rotate(roll);g.translate(-x,-y)}
function clear(c){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.shadowBlur=0;rect(0,0,1280,720,c)}


function gold(){let q=g.createLinearGradient(0,0,1280,720);[[0,'#75572d'],[.3,'#ddbb69'],[.5,'#fff1b0'],[.65,'#bd9147'],[1,'#6d482a']].forEach(x=>q.addColorStop(...x));return q}
function gl(pts,w=2){line(pts,'#251b13',w+3);line(pts,gold(),w);line(pts,'#e9cc8980',.6)}
function sun(x,y){for(let i=0;i<37;i++){let a=i*Math.PI/36;gl([[x+Math.cos(a)*90,y-Math.sin(a)*90],[x+Math.cos(a)*800,y-Math.sin(a)*800]],1)}}
function boy(x,y,s){g.save();g.translate(x,y);g.scale(s,s);let c=g.createLinearGradient(-25,0,25,0);c.addColorStop(0,'#312d29');c.addColorStop(.5,'#96927a');c.addColorStop(1,'#171916');poly([[-20,-85],[20,-85],[28,-10],[-28,-10]],c,'#ccaa66',1);circ(0,-106,15,'#ceb887');rect(-20,-128,40,12,'#9b2443');line([[-12,-10],[-14,30]],'#8e846e',13);line([[12,-10],[16,30]],'#8e846e',13);line([[15,-70],[44,-45]],'#b4a27e',9);rect(30,-60,42,28,'#ae2e48');line([[30,-60],[51,-44],[72,-60]],'#e6c883',1);g.restore()}
window.render=t=>{clear('#130f0c');let sc=t<6?0:t<12?1:t<16?2:3;sun(640,590);for(let i=0;i<10;i++){let w=110+i*46;gl([[640-w,650],[640-w,120+i*24],[640+w,120+i*24],[640+w,650]],1)}if(sc==0){for(let i=0;i<17;i++){let x=i*80;gl([[640,400],[x,720]],1)}circ(640,200,95,'#191711',gold(),4);for(let i=0;i<12;i++){let a=i*TAU/12;gl([[640+Math.sin(a)*78,200-Math.cos(a)*78],[640+Math.sin(a)*86,200-Math.cos(a)*86]],2)}gl([[640,200],[640+Math.sin(t*.7)*65,200-Math.cos(t*.7)*65]],3);boy(640,580,2);text('BEFORE MIDNIGHT',640,690,32,'#e7d092','Limelight',400,'center')}if(sc==1){let shift=(t-6)*75;for(let j=-2;j<6;j++){let y=550-j*110+shift%110;gl([[220,y],[1060,y]],2);text(String(j+5).padStart(2,'0'),250,y-20,32,'#d2b26b','Cinzel');for(let x of [365,770]){rect(x,y-98,145,92,'#1d2b27');gl([[x,y],[x,y-98],[x+145,y-98],[x+145,y]],2)}}rect(535,180,210,425,'#161916');gl([[535,605],[535,180],[745,180],[745,605]],4);boy(640,530,1.5);text('EXPRESS',640,150,32,'#e5c67c','Limelight',400,'center')}if(sc==2){let open=Q((t-12)/1.2);rect(345,125,590,505,'#16271f');sun(640,580);boy(640,520,2);for(let dir of [-1,1]){g.save();g.translate(dir*open*300,0);rect(dir<0?340:640,125,300,505,'#211b13');for(let i=0;i<6;i++)gl([[dir<0?360:660,150+i*72],[dir<0?615:915,150+i*72]],2);g.restore()}text('DELIVERED',640,690,34,'#ebd18b','Limelight',400,'center')}if(sc==3){for(let i=0;i<7;i++){let x=420-i*35,w=440+i*70,y=190+i*56;let q=g.createLinearGradient(x,y,x+w,y);q.addColorStop(0,'#152a25');q.addColorStop(.5,'#3c5244');q.addColorStop(1,'#19271f');rect(x,y,w,470,q);gl([[x,y+470],[x,y],[x+w,y],[x+w,y+470]],2)}text('STARLIGHT',640,330,82,'#eed895','Limelight',400,'center');text('HOTEL',640,410,62,'#eed895','Limelight',400,'center');for(let i=0;i<48;i++){let a=i*TAU/48;circ(640+Math.cos(a)*330,360+Math.sin(a)*130,4,i/48<S(16,18,t)?'#ffe5a0':'#54402b')}text('MIDNIGHT  /  A LETTER ARRIVES',640,690,23,'#dbbd7d','Cinzel',500,'center')}};

window.DUR=20;window.READY=false;await Promise.all([document.fonts.load('40px "Limelight"'),document.fonts.load('40px "Cinzel"')]);window.render(0);window.READY=true;</script>
