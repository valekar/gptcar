const TAU=Math.PI*2,cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),mix=(a,b,p)=>a+(b-a)*p,E=x=>{x=cl(x);return x*x*(3-2*x)},Q=x=>1-Math.pow(1-cl(x),4),hash=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)},S=(a,b,t)=>E((t-a)/(b-a));

)}text('VOLT // CONCEPT SCAN',55,59,32,hue,'Rajdhani');text('ORIGINAL E-BIKE STUDY',55,84,12,'#6b9f9e','Share Tech Mono');text('MODEL / NOT PRODUCTION SPECIFICATIONS',55,676,15,hue,'Share Tech Mono');for(let i=1;i<n;i++){round(52,140+i*55,230,41,0,'#07171b','#296165',1);text(['','360 Wh / BATTERY','250 W / HUB'][i],64,167+i*55,18,accent,'Rajdhani')}for(let x of [22,1258])line([[x,110],[x,600]],'#2d777a',1);};
