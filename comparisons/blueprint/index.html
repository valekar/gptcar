<!doctype html><meta charset="utf-8"><title>Cloud Catcher / Revision C</title><style>html,body{margin:0;overflow:hidden;background:#090c10}canvas{width:100vw;height:100vh;display:block}@font-face{font-family:"Architects Daughter";src:url("fonts/ArchitectsDaughter.ttf");font-weight:100 900;}@font-face{font-family:"Inter";src:url("fonts/Inter.ttf");font-weight:100 900;}</style><canvas></canvas><script type="module">
const C=document.querySelector('canvas'),g=C.getContext('2d');C.width=1280;C.height=720;
const TAU=Math.PI*2,cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),mix=(a,b,p)=>a+(b-a)*p,E=x=>{x=cl(x);return x*x*(3-2*x)},Q=x=>1-Math.pow(1-cl(x),4),hash=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)},S=(a,b,t)=>E((t-a)/(b-a));
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function line(pts,c='#fff',w=2,dash=[]){g.strokeStyle=c;g.lineWidth=w;g.lineJoin='round';g.lineCap='round';g.setLineDash(dash);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();g.setLineDash([])}
function poly(pts,c,stroke=null,w=2){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function circ(x,y,r,c,stroke=null,w=2){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function text(s,x,y,size=30,c='#fff',font='Inter',weight=500,align='left'){g.fillStyle=c;g.font=`${weight} ${size}px "${font}"`;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y)}
function round(x,y,w,h,r,c,stroke=null,lw=1){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function ellipse(x,y,rx,ry,c,stroke=null,w=2){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function camera(x,y,z,roll=0){g.translate(640,360);g.scale(z,z);g.rotate(roll);g.translate(-x,-y)}
function clear(c){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.shadowBlur=0;rect(0,0,1280,720,c)}


const blue='#244b85',white='#e5f0f3';
function gear(x,y,r,a){let pp=[];for(let i=0;i<48;i++){let aa=a+i*TAU/48,rr=r*(i%4<2?1:.83);pp.push([x+Math.cos(aa)*rr,y+Math.sin(aa)*rr])}poly(pp,blue,white,2);circ(x,y,r*.28,blue,white,1)}
function cloud(x,y,s,lit=false){g.save();g.translate(x,y);g.scale(s,s);g.beginPath();g.moveTo(-90,20);g.bezierCurveTo(-140,-10,-100,-55,-62,-40);g.bezierCurveTo(-65,-110,32,-115,45,-59);g.bezierCurveTo(95,-85,140,-20,90,20);g.closePath();if(lit){g.fillStyle='#afcde1';g.fill()}g.strokeStyle=white;g.lineWidth=2;g.stroke();g.restore()}
window.render=t=>{clear('#101c30');g.save();let sc=t<6?0:t<12?1:t<16?2:3;let z=sc==1?1.45:sc==2?1.2:1;camera(sc==1?615:640,sc==1?360:360,z);rect(40,24,1200,672,blue);for(let i=0;i<270;i++){let x=40+hash(i)*1200,y=24+hash(i+500)*672;line([[x,y],[x+40+hash(i+80)*100,y]],'#88b6dd10',.6)}g.strokeStyle=white;g.lineWidth=1;g.strokeRect(60,44,1160,632);text('CLOUD CATCHER',87,94,36,white,'Architects Daughter');text('EXPERIMENTAL APPARATUS / REV C',87,121,15,white,'Inter');let draw=cl(t/4);g.save();g.beginPath();g.rect(120,145,850*draw,455);g.clip();line([[250,540],[920,540]],white,2);line([[630,170],[630,550]],'#b1cbe0',1,[16,6,3,6]);let explode=sc==1?Math.sin(cl((t-6)/6)*Math.PI)*65:0;poly([[410,250],[850,250],[750,370],[510,370]],blue,white,3);line([[510,370],[540,475],[720,475],[750,370]],white,3);rect(520,480,220,50,blue);g.strokeStyle=white;g.strokeRect(520,480,220,50);for(let i=0;i<18;i++)line([[520+i*12,530],[540+i*12,480]],white,.6);gear(450-explode,430,58,t*.6);gear(340-explode*2,430,45,-t*.77);line([[450-explode,430],[555,430]],white,3);poly([[520,210-explode],[740,210-explode],[740,230-explode],[520,230-explode]],blue,white,2);line([[250,250],[250,540]],white,1);line([[238,250],[262,250]],white,1);line([[238,540],[262,540]],white,1);text('290',222,410,20,white,'Architects Daughter',400,'right');line([[410,575],[850,575]],white,1);text('440',630,600,21,white,'Architects Daughter',400,'center');for(let [x,y,n] of [[450,430,'01'],[630,220-explode,'02'],[720,495,'03']]){line([[x,y],[x+115,y-65],[x+175,y-65]],white,1);circ(x+175,y-65,16,blue,white,1);text(n,x+175,y-60,12,white,'Inter',400,'center')}g.restore();if(t>12){cloud(630,180,1,t>14);for(let i=0;i<35;i++){let x=515+hash(i)*230,y=245+((t-12)*100+hash(i+2)*170)%260;line([[x,y],[x-3,y+13]],white,1)}rect(540,520-33*S(14,18,t),180,33*S(14,18,t),'#6391bf')}text(sc==1?'FIG. 2  /  EXPLODED COLLECTOR':sc==2?'REVISION CLOUD / LIVE PRECIPITATION':'FIG. 1  /  GENERAL ARRANGEMENT',88,640,19,white,'Architects Daughter');line([[880,550],[1220,550]],white,1);line([[880,550],[880,676]],white,1);text('STATUS / PATENT PENDING',900,578,13,white);text('DESIGN STUDY — NOT A REAL PATENT',900,651,11,white);if(t>16){g.save();g.translate(1040,613);g.rotate(-.1);g.strokeStyle='#e36d65';g.lineWidth=4;g.strokeRect(-125,-29,250,55);text('APPROVED',0,13,32,'#e36d65','Inter',700,'center');g.restore()}g.restore()};

window.DUR=20;window.READY=false;await Promise.all([document.fonts.load('40px "Architects Daughter"'),document.fonts.load('40px "Inter"')]);window.render(0);window.READY=true;</script>
