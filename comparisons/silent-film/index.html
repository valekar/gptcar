<!doctype html><meta charset="utf-8"><title>The Runaway Loaf / A Share</title><style>html,body{margin:0;overflow:hidden;background:#090c10}canvas{width:100vw;height:100vh;display:block}@font-face{font-family:"Playfair Display SC";src:url("fonts/PlayfairDisplaySC.ttf");font-weight:100 900;}@font-face{font-family:"IM Fell English";src:url("fonts/IMFellEnglish.ttf");font-weight:100 900;}</style><canvas></canvas><script type="module">
const C=document.querySelector('canvas'),g=C.getContext('2d');C.width=1280;C.height=720;
const TAU=Math.PI*2,cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),mix=(a,b,p)=>a+(b-a)*p,E=x=>{x=cl(x);return x*x*(3-2*x)},Q=x=>1-Math.pow(1-cl(x),4),hash=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)},S=(a,b,t)=>E((t-a)/(b-a));
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function line(pts,c='#fff',w=2,dash=[]){g.strokeStyle=c;g.lineWidth=w;g.lineJoin='round';g.lineCap='round';g.setLineDash(dash);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();g.setLineDash([])}
function poly(pts,c,stroke=null,w=2){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function circ(x,y,r,c,stroke=null,w=2){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function text(s,x,y,size=30,c='#fff',font='Inter',weight=500,align='left'){g.fillStyle=c;g.font=`${weight} ${size}px "${font}"`;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y)}
function round(x,y,w,h,r,c,stroke=null,lw=1){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function ellipse(x,y,rx,ry,c,stroke=null,w=2){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function camera(x,y,z,roll=0){g.translate(640,360);g.scale(z,z);g.rotate(roll);g.translate(-x,-y)}
function clear(c){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.shadowBlur=0;rect(0,0,1280,720,c)}


const paper='#bdb8a7',ink='#292825';
function hatched(pts,fill,seed=1){poly(pts,fill,ink,2);g.save();g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.clip();for(let i=-100;i<1400;i+=7)line([[i,-100],[i+900,800]],'#27292229',.7);g.restore()}
function actor(x,y,s,t,girl=false,reach=0){g.save();g.translate(x,y);g.scale(s,s);let a=Math.sin(Math.floor(t*16)/16*12)*12;let coat=girl?'#77756c':'#454b48';hatched([[-25,-105],[21,-105],[girl?36:28,-18],[-35,-18]],coat);line([[-17,-18],[-19+a,36]],ink,15);line([[17,-18],[20-a,36]],ink,15);line([[-19,-89],[-41,-40],[-44,-9]],'#a4a697',12);line([[18,-88],[40+reach*20,-61],[50+reach*45,-51]],'#adae9e',12);ellipse(0,-128,18,26,'#d8d3bc',ink,2);line([[-10,-130],[-4,-129]],ink,2);line([[6,-130],[11,-129]],ink,2);line([[-2,-117],[5,-117]],ink,1);if(girl){hatched([[-20,-142],[-7,-161],[16,-153],[23,-132],[8,-140],[-11,-141]],'#474b43')}else{hatched([[-24,-149],[17,-149],[25,-142],[-25,-141]],'#a8aa9c');hatched([[-18,-160],[14,-160],[19,-149],[-22,-149]],'#b8b7a5')}g.restore()}
function loaf(x,y,r,ang,half=false){g.save();g.translate(x,y);g.rotate(ang);ellipse(0,0,r*1.4,r,'#a49b7c',ink,2);g.save();g.beginPath();g.ellipse(0,0,r*1.4,r,0,0,TAU);g.clip();for(let i=-r;i<r;i+=8)line([[i-10,-r],[i+10,r]],'#5e5d4d',2);g.restore();if(half)rect(0,-r-2,r*1.7,r*2+4,paper);g.restore()}
function street(t){rect(160,0,960,720,paper);for(let i=0;i<6;i++){let x=120+i*195;hatched([[x,80],[x+170,80],[x+170,490],[x,490]],i%2?'#a7aaa0':'#c9c7b6');for(let j=0;j<3;j++){rect(x+30,115+j*105,45,68,'#676f6a');rect(x+100,115+j*105,40,68,'#7c8278');line([[x+30,148+j*105],[x+74,148+j*105]],paper,2)}}hatched([[160,455],[1120,570],[1120,720],[160,720]],'#8a8e81');for(let i=0;i<14;i++)line([[150,490+i*19],[1130,605+i*19]],'#4f554d',1);for(let i=0;i<17;i++)line([[i*80+120,500],[i*80+85,720]],'#61675d',1)}
window.render=t=>{clear('#211c1b');for(let i=0;i<20;i++){let x=i<10?i*17:1110+(i-10)*17;let c=g.createLinearGradient(x,0,x+20,0);c.addColorStop(0,'#392b2c');c.addColorStop(.5,'#604245');c.addColorStop(1,'#1d181a');rect(x,0,24,720,c)}g.save();g.beginPath();g.roundRect(160,10,960,700,16);g.clip();let tt=Math.floor(t*16)/16,wx=Math.sin(t*17)*1.4,wy=Math.sin(t*24)*.7;g.translate(wx,wy);if(t<10){street(t);let p=t<6?cl(t/6):cl((t-6)/4);let x=t<6?mix(260,660,p):mix(410,700,p),y=470+(x-160)*.12;let bx=t<6?x+180:mix(590,850,p),by=480+(bx-160)*.12;actor(x,y,1.35,tt,false,S(6,9,t));loaf(bx,by-28,35,(bx-300)/35);if(t>6)actor(1000,574,1.15,0,true);text('BAKERY',260,300,24,ink,'Playfair Display SC',400)}else if(t<13){rect(160,0,960,720,'#292826');g.strokeStyle='#a7a58f';g.lineWidth=2;g.strokeRect(220,90,840,540);g.strokeRect(234,104,812,512);for(let x of [234,1046])for(let y of [104,616]){line([[x-18,y],[x+18,y]],'#c3bda0',2);line([[x,y-18],[x,y+18]],'#c3bda0',2)}text('Enough for two.',640,380,57,'#dfd9bf','IM Fell English',400,'center')}else{street(t);g.save();camera(690,440,1.18);hatched([[500,540],[910,540],[910,562],[500,562]],'#696c60');line([[520,560],[516,642]],ink,10);line([[885,560],[895,642]],ink,10);actor(590,529,1.4,0,false,.6);actor(810,552,1.1,0,true,.4);let p=S(13.8,16.8,t);loaf(mix(665,735,p),460,28,-.1,true);loaf(654,461,28,Math.PI,true);g.restore();if(t>18){let r=mix(690,220,S(18,20,t));g.fillStyle='#252421';g.beginPath();g.rect(160,0,960,720);g.arc(710,430,r,0,TAU,true);g.fill('evenodd')}}for(let i=0;i<8;i++){let x=170+hash(i+Math.floor(t*3))*940;line([[x,50+hash(i)*180],[x+.5,500+hash(i+3)*200]],'#e6e0bc2c',.6)}g.globalAlpha=.035+.025*Math.sin(t*TAU*7);rect(160,0,960,720,'#fff9da');g.globalAlpha=1;g.restore();};

window.DUR=20;window.READY=false;await Promise.all([document.fonts.load('40px "Playfair Display SC"'),document.fonts.load('40px "IM Fell English"')]);window.render(0);window.READY=true;</script>
