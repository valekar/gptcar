<!doctype html><meta charset="utf-8"><title>Motion / Selected Sports</title><style>html,body{margin:0;overflow:hidden;background:#090c10}canvas{width:100vw;height:100vh;display:block}@font-face{font-family:"Inter";src:url("fonts/Inter.ttf");font-weight:100 900;}@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono.ttf");font-weight:100 900;}</style><canvas></canvas><script type="module">
const C=document.querySelector('canvas'),g=C.getContext('2d');C.width=1280;C.height=720;
const TAU=Math.PI*2,cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),mix=(a,b,p)=>a+(b-a)*p,E=x=>{x=cl(x);return x*x*(3-2*x)},Q=x=>1-Math.pow(1-cl(x),4),hash=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)},S=(a,b,t)=>E((t-a)/(b-a));
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function line(pts,c='#fff',w=2,dash=[]){g.strokeStyle=c;g.lineWidth=w;g.lineJoin='round';g.lineCap='round';g.setLineDash(dash);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();g.setLineDash([])}
function poly(pts,c,stroke=null,w=2){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function circ(x,y,r,c,stroke=null,w=2){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function text(s,x,y,size=30,c='#fff',font='Inter',weight=500,align='left'){g.fillStyle=c;g.font=`${weight} ${size}px "${font}"`;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y)}
function round(x,y,w,h,r,c,stroke=null,lw=1){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function ellipse(x,y,rx,ry,c,stroke=null,w=2){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function camera(x,y,z,roll=0){g.translate(640,360);g.scale(z,z);g.rotate(roll);g.translate(-x,-y)}
function clear(c){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.shadowBlur=0;rect(0,0,1280,720,c)}


const cards=[['RUN','COURIR','#d7ac35','#463b1b'],['DRAW','TIRER','#255c6b','#f7e9cc'],['SWIM','NAGER','#c65455','#f7e9cc']];
function pattern(bg,t){rect(0,0,1280,720,bg);for(let r=0;r<7;r++)for(let c=-1;c<14;c++){let x=c*112+(r%2?1:-1)*(t*13%112),y=r*112;g.save();g.globalAlpha=.1+(r+c+40)%3*.045;if((r+c)%3==0)circ(x+56,y+56,54,'#fff');else if((r+c)%3==1){g.fillStyle='#000';g.beginPath();g.arc(x,y,110,0,Math.PI/2);g.lineTo(x,y);g.fill()}else{for(let q=0;q<4;q++)line([[x+q*25,y],[x+q*25,y+105]],'#fff',6)}g.restore()}}
function limb(p,c,w=23){line(p,c,w)}
function athlete(x,y,s,kind,t,c){g.save();g.translate(x,y);g.scale(s,s);if(kind==0){let a=Math.sin(t*TAU*2+.8);limb([[-5,-45],[20,0]],c);limb([[20,0],[52*a,35],[60*a,80]],c);limb([[20,0],[-45*a,36],[-55*a,76]],c);limb([[0,-40],[-45*a,-15],[-65*a,-45]],c);limb([[0,-40],[42*a,-65],[60*a,-40]],c);circ(-15,-77,19,c)}else if(kind==1){limb([[0,-43],[0,17]],c);limb([[0,17],[-28,84]],c);limb([[0,17],[38,84]],c);limb([[0,-35],[74,-37]],c,18);let p=S(7,8,t)*(1-S(9,9.4,t));limb([[0,-35],[-20-30*p,-56],[35-35*p,-45]],c,17);circ(0,-78,19,c);g.beginPath();g.arc(78,-38,65,-1.25,1.25);g.strokeStyle=c;g.lineWidth=6;g.stroke();line([[98,-100],[65-30*p,-38],[98,24]],c,2);let ar=cl((t-9.4)*500);line([[45+ar,-38],[130+ar,-38]],c,3)}else{let a=Math.sin(t*TAU);limb([[-62,5],[65,5]],c,28);limb([[35,5],[90,-50-a*25],[135,-20]],c,21);limb([[-20,5],[-70,-15+a*20],[-110,-5]],c,21);limb([[-60,5],[-105,40+a*13]],c,19);circ(84,2,20,c);for(let i=0;i<5;i++){g.beginPath();g.arc(i*55-110,67,30,Math.PI,TAU);g.strokeStyle=c;g.lineWidth=4;g.stroke()}}g.restore()}
window.render=t=>{let n=t<6?0:t<12?1:t<16?2:3;if(n<3){let [a,b,bg,fg]=cards[n];clear(bg);pattern(bg,t);circ(925,345,235,n==0?'#e9c963':n==1?'#3d7280':'#d77170');let local=t-[0,6,12][n];let reveal=Q(local/.4);g.save();g.beginPath();g.rect(60,180,620,350);g.clip();text(a,65,360+(1-reveal)*160,150,fg,'Inter',900);text(b,72,425+(1-Q((local-.08)/.4))*90,50,fg,'Inter',800);g.restore();g.save();g.beginPath();g.rect(680,90,590,520);g.clip();athlete(930,355,1.65,n,t,fg);g.restore();text('MOTION / SELECTED SPORTS',65,60,16,fg,'JetBrains Mono');text('0'+(n+1)+' / 03',1210,60,19,fg,'JetBrains Mono',500,'right');for(let i=0;i<3;i++)rect(65+i*40,650,i==n?28:18,i==n?11:5,fg);if(n==1){circ(1210,300,43,'#d8c484');circ(1210,300,27,bg);circ(1210,300,9,fg)}}else{clear('#f0e7d2');for(let i=0;i<3;i++){let bg=cards[i][2];rect(35+i*415,80,395,540,bg);circ(232+i*415,330,150,i==0?'#e4c76e':i==1?'#3d7280':'#d77170');athlete(232+i*415,315,1.1,i,t,cards[i][3]);text(cards[i][0],232+i*415,565,50,cards[i][3],'Inter',900,'center')}text('THREE ACTIONS. ONE GRID.',640,687,25,'#25252b','Inter',800,'center')}};

window.DUR=20;window.READY=false;await Promise.all([document.fonts.load('40px "Inter"'),document.fonts.load('40px "JetBrains Mono"')]);window.render(0);window.READY=true;</script>
