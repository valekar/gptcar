<!doctype html><meta charset="utf-8"><title>Five-Second Astronaut / Homeward</title><style>html,body{margin:0;overflow:hidden;background:#090c10}canvas{width:100vw;height:100vh;display:block}@font-face{font-family:"Lilita One";src:url("fonts/LilitaOne.ttf");font-weight:100 900;}@font-face{font-family:"Inter";src:url("fonts/Inter.ttf");font-weight:100 900;}@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono.ttf");font-weight:100 900;}</style><canvas></canvas><script type="module">
const C=document.querySelector('canvas'),g=C.getContext('2d');C.width=1280;C.height=720;
const TAU=Math.PI*2,cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),mix=(a,b,p)=>a+(b-a)*p,E=x=>{x=cl(x);return x*x*(3-2*x)},Q=x=>1-Math.pow(1-cl(x),4),hash=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)},S=(a,b,t)=>E((t-a)/(b-a));
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function line(pts,c='#fff',w=2,dash=[]){g.strokeStyle=c;g.lineWidth=w;g.lineJoin='round';g.lineCap='round';g.setLineDash(dash);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();g.setLineDash([])}
function poly(pts,c,stroke=null,w=2){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function circ(x,y,r,c,stroke=null,w=2){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function text(s,x,y,size=30,c='#fff',font='Inter',weight=500,align='left'){g.fillStyle=c;g.font=`${weight} ${size}px "${font}"`;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y)}
function round(x,y,w,h,r,c,stroke=null,lw=1){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function ellipse(x,y,rx,ry,c,stroke=null,w=2){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function camera(x,y,z,roll=0){g.translate(640,360);g.scale(z,z);g.rotate(roll);g.translate(-x,-y)}
function clear(c){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.shadowBlur=0;rect(0,0,1280,720,c)}


const ink='#251837',cream='#fff1d8';
function outlined(s,x,y,z,c=cream){g.font=`700 ${z}px "Lilita One"`;g.textAlign='center';g.lineWidth=z*.12;g.strokeStyle=ink;g.strokeText(s,x,y);g.fillStyle=c;g.fillText(s,x,y)}
function astronaut(x,y,s,t,medium){g.save();g.translate(x,y);g.scale(s,s);let c=medium==0?'#d9efff':medium==2?'#121212':'#faf0d4';if(medium==1){for(let j=0;j<13;j++)for(let i=0;i<10;i++)if((i-4.5)**2/24+(j-6)**2/43<1)rect((i-5)*8,(j-13)*8,8,8,j<5?'#c86637':c);rect(-24,-82,48,24,'#292856');rect(38,-74,12,25,'#c86637');rect(-24,-10,17,34,c);rect(10,-10,17,34,c)}else{round(-40,-100,80,95,22,c,medium==0?'#e8f7ff':ink,5);circ(0,-93,43,c,medium==0?'#e8f7ff':ink,5);round(-32,-112,64,37,12,medium==0?'#214b83':'#333359',medium==0?'#e8f7ff':ink,3);rect(36,-102,12,26,medium==2?'#ff5638':'#e37c3c');line([[-23,-11],[-25,30]],c,21);line([[23,-11],[25,30]],c,21);line([[-39,-62],[-63,-23]],c,18);line([[39,-62],[63,-23]],c,18)}g.restore()}
function stage(t,life,word){clear('#39116c');for(let i=0;i<22;i++){let a=i*TAU/22+t*.12;poly([[640,350],[640+Math.cos(a)*1100,350+Math.sin(a)*1100],[640+Math.cos(a+.09)*1100,350+Math.sin(a+.09)*1100]],'#53218b')}round(320,135,640,375,28,'#140d27',ink,10);round(343,158,594,328,15,'#6f4eb4',cream,5);astronaut(640,410,1.5,t,3);outlined('CADET / '+word,640,95,48,'#ffc928');for(let i=0;i<3;i++){circ(490+i*150,605,28,i<life?'#ff497e':'#6a4778',ink,5);text(i<life?'♥':'×',490+i*150,617,34,cream,'Inter',800,'center')}outlined('HOMEWARD TRAINING',640,686,25)}
window.render=t=>{let n=t<5?0:t<9.5?1:t<13.5?2:3,starts=[0,5,9.5,13.5],len=[5,4.5,4,6.5],l=t-starts[n],word=['SEAL!','AIM!','DOCK!','LAND!'][n];if(l<.55||n==3&&t>18.5){stage(t,n<2?3:2,t>18.5?'COMPLETE':word);return}let medium=n;if(n==0){clear('#214b83');for(let x=0;x<1280;x+=50)line([[x,0],[x,720]],'#e4f3ff13',1);for(let y=0;y<720;y+=50)line([[0,y],[1280,y]],'#e4f3ff13',1);astronaut(640,505,2.5,t,0);let p=Q((l-.6)/1.8);line([[420,190],[860,190]],'#d9efff',1,[12,8]);line([[420,180],[420,208]],'#d9efff',2);line([[860,180],[860,208]],'#d9efff',2);text('VISOR SEAL / ENGAGED',640,625,24,'#d9efff','JetBrains Mono',400,'center');g.beginPath();g.arc(640,274,110,0,Math.PI*2*p);g.strokeStyle='#d9efff';g.lineWidth=7;g.stroke();if(l>3.5)outlined('SEALED',970,390,55,'#64e0bb')}
if(n==1){clear('#1d2446');for(let i=0;i<80;i++)rect(Math.floor(hash(i)*80)*16,Math.floor(hash(i+20)*45)*16,5,5,'#8598a8');rect(100,545,1080,38,'#426179');astronaut(330,510,2,t,1);let p=cl((l-.5)/2.7),xx=450+p*650,yy=300-Math.sin(p*Math.PI)*170;for(let i=0;i<5;i++)rect(xx-i*16,yy+i*5,12,12,i%2?'#ffc928':'#f08949');rect(1000,355,80,60,'#70b7ad');rect(1015,370,50,30,'#1d2446');if(l>3.2){outlined('MISSED!',810,185,85,'#ff7e8f');text('LIVES  3 → 2',640,650,25,cream,'JetBrains Mono',500,'center')}}
if(n==2){clear('#f1eee6');for(let x=60;x<1280;x+=110)line([[x,50],[x,670]],'#ccc7bc',1);for(let y=50;y<720;y+=110)line([[60,y],[1220,y]],'#ccc7bc',1);rect(760,280,310,180,'#111');let p=Q((l-.7)/2);rect(mix(145,760,p),280,310,180,'#ff5638');rect(790,310,250,120,'#f1eee6');astronaut(350,565,1.4,t,2);text('ALIGN / LOCK / RELEASE',80,665,24,'#111','Inter',800);if(l>2.8)text('LOCKED',885,397,42,'#111','Inter',800,'center')}
if(n==3){clear('#76cfd0');circ(1050,160,95,'#ffe48c');for(let i=0;i<8;i++)ellipse(i*210-100,530,210,130,'#65b677');rect(0,580,1280,140,'#3e826a');round(430,555,420,35,12,'#fff1d8',ink,6);let p=Q((l-.6)/3.7),y=mix(140,540,p);poly([[560,y],[640,y-110],[720,y],[690,y+40],[590,y+40]],'#f1e5ca',ink,7);round(605,y-63,70,55,12,'#3c6e86',ink,6);if(p<.95)poly([[600,y+42],[620,y+80+Math.sin(t*35)*15],[640,y+42]],'#ff9e42');if(l>4.3)outlined('HOME!',640,235,96,'#fff1d8')}
outlined(word,170,100,l<1?80:43,'#fff1d8');let left=cl(1-(l-.5)/(len[n]-.8));line([[130,690],[1150,690]],'#20172a',11);line([[130,690],[130+1020*left,690]],'#ffc928',6);circ(130+1020*left,690,8,'#fff1d8');};

window.DUR=20;window.READY=false;await Promise.all([document.fonts.load('40px "Lilita One"'),document.fonts.load('40px "Inter"'),document.fonts.load('40px "JetBrains Mono"')]);window.render(0);window.READY=true;</script>
