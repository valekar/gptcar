<!doctype html><meta charset="utf-8"><title>Five Rules / One Exception</title><style>html,body{margin:0;overflow:hidden;background:#090c10}canvas{width:100vw;height:100vh;display:block}@font-face{font-family:"Inter";src:url("fonts/Inter.ttf");font-weight:100 900;}</style><canvas></canvas><script type="module">
const C=document.querySelector('canvas'),g=C.getContext('2d');C.width=1280;C.height=720;
const TAU=Math.PI*2,cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),mix=(a,b,p)=>a+(b-a)*p,E=x=>{x=cl(x);return x*x*(3-2*x)},Q=x=>1-Math.pow(1-cl(x),4),hash=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)},S=(a,b,t)=>E((t-a)/(b-a));
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function line(pts,c='#fff',w=2,dash=[]){g.strokeStyle=c;g.lineWidth=w;g.lineJoin='round';g.lineCap='round';g.setLineDash(dash);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();g.setLineDash([])}
function poly(pts,c,stroke=null,w=2){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function circ(x,y,r,c,stroke=null,w=2){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function text(s,x,y,size=30,c='#fff',font='Inter',weight=500,align='left'){g.fillStyle=c;g.font=`${weight} ${size}px "${font}"`;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y)}
function round(x,y,w,h,r,c,stroke=null,lw=1){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function ellipse(x,y,rx,ry,c,stroke=null,w=2){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function camera(x,y,z,roll=0){g.translate(640,360);g.scale(z,z);g.rotate(roll);g.translate(-x,-y)}
function clear(c){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.shadowBlur=0;rect(0,0,1280,720,c)}


function poster(t,x,y,w,h){g.save();g.translate(x,y);const sc=w/440;g.scale(sc,sc);rect(0,0,440,h/sc,'#fff');let k=Math.min(5,Math.floor(t/4)+1);for(let i=0;i<8;i++){let yy=80+i*48;let wid=[260,145,310,195,250,100,275,170][i];let a=Q((t-i*.14)/.55);rect(36,yy,wid*a,32,'#121212')}let off=t>16?(t-16)*14:0;g.save();g.translate(320+off,115+off*.7);g.rotate(t>16?(t-16)*.045:0);rect(-34,-32,66,330,'#f34620');g.restore();text('NIGHT',32,520,70,'#141414','Inter',800);text('ASSEMBLY',32,587,58,'#141414','Inter',800);line([[36,625],[404,625]],'#141414',2);text('FRIDAY  /  20:00  /  HALL 07',36,651,13,'#141414');g.restore()}
window.render=t=>{clear('#eae9e5');let n=Math.min(4,Math.floor(t/4));let local=t%4;let titles=['use a grid','align left','change scale','remove excess','break one rule'];let z=t<4?mix(1.8,1,Q(t/2)):1;g.save();camera(640,360,z);for(let x=64;x<1280;x+=96)line([[x,40],[x,680]],'#d5d4cf',1);for(let y=48;y<720;y+=48)line([[48,y],[1232,y]],'#ddddd6',1);text('0'+(n+1),54,275,250,'#111','Inter',800);text(titles[n],64,390,48,'#111','Inter',700);line([[64,460],[510,460]],'#111',2);text('POSTER PROGRAMME  /  '+String(n+1).padStart(2,'0'),64,490,15,'#666');text('one typeface · one signal · one exception',64,518,15,'#666');g.save();if(n==2){g.translate(935,365);g.rotate(-Math.PI/2*E(local/.65));g.translate(-935,-365);poster(t,715,25,440,675)}else poster(t,715,25,440,675);g.restore();if(n==3){let yy=160+420*cl(local/2);line([[706,yy],[1170,yy]],'#111',1);if(local>2){rect(730,225,260*(1-S(14,15,t)),4,'#eae9e5')}}g.restore();text('FIVE RULES FOR A CONCERT POSTER',64,690,14,'#555');for(let i=0;i<5;i++)rect(590+i*19,677,12,5,i<=n?'#111':'#c4c4be');};

window.DUR=20;window.READY=false;await Promise.all([document.fonts.load('40px "Inter"')]);window.render(0);window.READY=true;</script>
