<!doctype html><meta charset="utf-8"><title>The East Window / A Pact</title><style>html,body{margin:0;overflow:hidden;background:#090c10}canvas{width:100vw;height:100vh;display:block}@font-face{font-family:"Cinzel";src:url("fonts/Cinzel.ttf");font-weight:100 900;}@font-face{font-family:"IM Fell English";src:url("fonts/IMFellEnglish.ttf");font-weight:100 900;}</style><canvas></canvas><script type="module">
const C=document.querySelector('canvas'),g=C.getContext('2d');C.width=1280;C.height=720;
const TAU=Math.PI*2,cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),mix=(a,b,p)=>a+(b-a)*p,E=x=>{x=cl(x);return x*x*(3-2*x)},Q=x=>1-Math.pow(1-cl(x),4),hash=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)},S=(a,b,t)=>E((t-a)/(b-a));
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function line(pts,c='#fff',w=2,dash=[]){g.strokeStyle=c;g.lineWidth=w;g.lineJoin='round';g.lineCap='round';g.setLineDash(dash);g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();g.setLineDash([])}
function poly(pts,c,stroke=null,w=2){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function circ(x,y,r,c,stroke=null,w=2){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function text(s,x,y,size=30,c='#fff',font='Inter',weight=500,align='left'){g.fillStyle=c;g.font=`${weight} ${size}px "${font}"`;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y)}
function round(x,y,w,h,r,c,stroke=null,lw=1){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function ellipse(x,y,rx,ry,c,stroke=null,w=2){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fillStyle=c;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function camera(x,y,z,roll=0){g.translate(640,360);g.scale(z,z);g.rotate(roll);g.translate(-x,-y)}
function clear(c){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.shadowBlur=0;rect(0,0,1280,720,c)}


const lead='#171d20';
function piece(pts,c,lit=1,seed=1){g.save();g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=c;g.fill();g.clip();for(let i=0;i<22;i++){let x=pts[0][0]+hash(i+seed)*230-80,y=pts[0][1]+hash(i+seed+200)*300-120;line([[x,y],[x+20,y+100]],i%2?'#ffffff18':'#00000016',2+hash(i)*5)}g.fillStyle=`rgba(5,11,22,${.65*(1-lit)})`;g.fillRect(-1000,-1000,4000,4000);g.restore();line([...pts,pts[0]],'#565753',7);line([...pts,pts[0]],lead,4);}
function knight(x,y,lit,t){g.save();g.translate(x,y);let a=Math.floor(Math.min(t,6)*8)/8;let sx=Math.sin(a)*3;piece([[-36,-90],[35,-90],[47,35],[-45,35]],'#bb3542',lit,3);piece([[-30,-88],[24,-88],[35,-5],[5,35],[-33,2]],'#bcc5ba',lit,7);piece([[-17,34],[-2,34],[0,102],[-25,102]],'#487291',lit,13);piece([[4,34],[22,34],[35,102],[8,102]],'#487291',lit,15);piece([[-15,-130],[17,-130],[30,-105],[15,-85],[-18,-91],[-28,-111]],'#a7ac9a',lit,9);line([[-14,-111],[13,-111]],'#4c3b2d',2);line([[6,-108],[15,-103],[5,-99]],'#4c3b2d',1);piece([[30,-72],[47,-69],[80+sx,-120],[74+sx,-128]],'#dbb94a',lit,9);piece([[-45,-60],[-68,-40],[-60,6],[-35,25],[-15,1],[-19,-43]],'#344f9f',lit,10);line([[-61,-29],[-29,-15],[-40,12]],'#63563d',2);g.restore()}
function dragon(x,y,lit,t){g.save();g.translate(x,y);let a=Math.floor(Math.min(t,12)*8)/8;let bend=Math.sin(a)*4;piece([[-70,18],[-50,-45],[5,-64],[62,-24],[57,43],[0,70],[-50,50]],'#b52640',lit,20);piece([[-15,-43],[-70,-135],[-103,-66],[-87,-16]],'#244c9d',lit,21);piece([[8,-46],[45,-150],[94,-70],[74,-15]],'#244c9d',lit,22);piece([[44,-20],[72,-87],[113,-94],[130,-73],[99,-50],[84,12]],'#be394a',lit,23);piece([[100,-96],[120,-115],[116,-85]],'#dfb552',lit,28);piece([[-50,25],[-103,5],[-131,42],[-153,10],[-142,73],[-110,79]],'#b42e42',lit,24);piece([[-35,48],[-24,100],[0,100],[-2,56]],'#a7283d',lit,25);piece([[21,49],[36,100],[65,100],[48,40]],'#a7283d',lit,26);line([[111,-78],[120,-78]],'#362c21',3);for(let i=0;i<6;i++)line([[-41+i*15,-5],[-36+i*15,-12],[-29+i*15,-4]],'#512b29',1.8);g.restore()}
window.render=t=>{clear('#22272a');g.save();let z=t<6?1.55:t<12?1.5:t<16?1.2:mix(1.15,.86,S(16,20,t));let cx=t<6?390:t<12?860:640;camera(cx,340,z);for(let j=0;j<8;j++)for(let i=0;i<11;i++){let x=i*128+(j%2)*64;rect(x,j*95,125,92,j%2?'#343a3c':'#303638')}let litCenter=mix(300,1010,t/20);for(let panel=0;panel<3;panel++){let x=260+panel*260;g.save();g.beginPath();g.moveTo(x-118,590);g.lineTo(x-118,205);g.quadraticCurveTo(x-118,95,x,65);g.quadraticCurveTo(x+118,95,x+118,205);g.lineTo(x+118,590);g.closePath();g.fillStyle='#17232a';g.fill();g.clip();for(let j=0;j<9;j++)for(let i=0;i<5;i++){let xx=x-130+i*65+(j%2)*32,yy=130+j*63;let lit=cl(1-Math.abs(xx-litCenter)/300,.12,1);piece([[xx,yy-40],[xx+34,yy],[xx,yy+40],[xx-34,yy]],(i+j)%4?'#1c4290':'#9a2640',lit,i+j*9+panel*90)}let lit=cl(1-Math.abs(x-litCenter)/310,.14,1);if(panel==0)knight(x,415,lit,t);if(panel==1){piece([[x-85,450],[x,360],[x+85,450],[x+55,485],[x-55,485]],'#d6b34b',lit,61);line([[x-55,451],[x+55,451]],'#593e24',2)}if(panel==2)dragon(x+10,390,lit,t);g.save();g.globalCompositeOperation='screen';let beam=g.createLinearGradient(litCenter-180,0,litCenter+180,0);beam.addColorStop(0,'#eed8a000');beam.addColorStop(.5,'#ddbe5650');beam.addColorStop(1,'#eed8a000');rect(x-125,60,250,540,beam);g.restore();g.restore();g.strokeStyle='#101517';g.lineWidth=13;g.stroke();for(let yy of [225,530])line([[x-120,yy],[x+120,yy]],'#333b3d',6)}if(t>12&&t<16){let a=cl((t-12)*4);line([[640,150],[630,240],[652,330],[635,410],[660,500*a]],t<12.3?'#fff3c0':'#2f3434',t<12.3?2:5)}for(let i=0;i<3;i++){g.save();g.filter='blur(16px)';let x=270+i*260;poly([[x-100,600],[x+100,600],[x+200,850],[x-160,850]],i%2?'#8c274440':'#2e62b550');g.restore()}text('THE EAST WINDOW',640,650,29,'#b9b5a0','Cinzel',500,'center');g.restore();};

window.DUR=20;window.READY=false;await Promise.all([document.fonts.load('40px "Cinzel"'),document.fonts.load('40px "IM Fell English"')]);window.render(0);window.READY=true;</script>
