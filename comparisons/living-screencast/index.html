<!doctype html><meta charset="utf-8"><title>Pip Moves In</title><style>@font-face{font-family:"Inter";src:url("fonts/Inter.ttf");font-weight:100 900;}@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono.ttf");font-weight:100 900;}

r:#2e4b43}canvas{position:absolute;inset:0;pointer-events:none}#chapter{position:absolute;left:97px;top:22px;border-radius:20px;background:#eff3e8b8;padding:6px 15px;font-size:12px;color:#3b5a50}</style>

<script type="module">
const C=document.querySelector('canvas'),g=C.getContext('2d');C.width=1280;C.height=720;let q=s=>document.querySelector(s),cl=x=>Math.max(0,Math.min(1,x)),E=x=>{x=cl(x);return x*x*(3-2*x)},mix=(a,b,p)=>a+(b-a)*p;
const sprite=['...GGGGGG...','..GGGGGGGG..','.GGGGGGGGGG.','.GGWWGGWWGG.','.GGWBGGWBGG.','.GGGGGGGGGG.','..GGGGGGGG..','...GGGGGG...','..GG.GG.GG..','.GG..GG..GG.','.....GG.....','....G..G....','...GG..GG...'];
function drawPip(x,y,t,cheer=false){let unit=4,phase=Math.floor(t*8)%4;g.save();g.translate(Math.round(x/2)*2,Math.round(y/2)*2);let sq=1+.045*Math.sin(t*8);g.scale(1/sq,sq);for(let j=0;j<sprite.length;j++)for(let i=0;i<sprite[j].length;i++){let c=sprite[j][i];if(c=='.')continue;g.fillStyle={G:'#ea713d',W:'#fff4db',B:'#304842'}[c];g.fillRect((i-6)*unit,(j-13)*unit,unit,unit)}if(cheer){g.fillStyle='#ea713d';g.fillRect(-34,-38,8,20);g.fillRect(26,-38,8,20)}g.restore()}
window.render=t=>{let n=Math.min(3,Math.floor(t/5));q('#chapter').textContent=['01 / ARRIVE','02 / PLAN','03 / APPLY','04 / CHECK'][n];let cmd='Make the card spacing comfortable.';q('#typed').textContent='> '+cmd.slice(0,Math.floor(t*20));q('#response').textContent=t>3?'Reading card.css …':'';q('#heading').textContent=n==3?'Checked. Saved. Ready.':'Give the card room to breathe.';q('#saved').textContent=n==3?'Saved locally':'Workspace ready';q('#diff').textContent=n>=2?'.card {\n  padding: 24px;\n  border-radius: 8px;\n}':'.card {\n  padding: 12px;\n  border-radius: 8px;\n}';q('#diff').className=n>=2?'added':'';q('#checks').textContent=n>=3?'✓ CSS valid\n✓ Card fits viewport\n✓ Saved card.css':'';q('#hud').textContent=['One small helper, inside the work.','Read. Plan. Three clear steps.','A twelve-pixel change, applied.','Checks pass. The work is saved.'][n];let zoom=n==1?1.15:n==2?1.14:1;let tx=n==2?-90:n==1?65:0;q('#screen').style.transform=`translate(${tx}px,${n==1?-45:0}px) scale(${zoom})`;g.clearRect(0,0,1280,720);let anchor=q(n==0?'#origin':n==1?['#p1','#p2','#p3'][Math.min(2,Math.floor((t-5)/1.6))]:n==2?'#apply':'#saved').getBoundingClientRect();let x=anchor.x+Math.min(anchor.width*.6,110),y=anchor.y;let jump=n==0?Math.sin(Math.PI*cl((t-1)/2))*80:n==2?Math.sin(Math.PI*cl((t-10)/1.5))*65:0;drawPip(x,y-jump,t,n==3);let target=q(n<1?'#terminal':n==1?'#planbutton':n==2?'#apply':'#checks').getBoundingClientRect();let cx=target.x+target.width*.7,cy=target.y+target.height*.6;g.fillStyle='#f8fff6';g.strokeStyle='#294b40';g.lineWidth=2;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+3,cy+24);g.lineTo(cx+10,cy+16);g.lineTo(cx+22,cy+15);g.closePath();g.fill();g.stroke();};window.DUR=20;await Promise.all([document.fonts.load('20px Inter'),document.fonts.load('20px "JetBrains Mono"')]);window.render(0);window.READY=true;
</script>
