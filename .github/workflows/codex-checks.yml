name: Codex adapter checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_codexcar.py
      - run: python3 -m unittest discover -s tests -v
      - run: sh -n .agents/skills/codexcar/scripts/setup.sh && sh -n tools/setup.sh
